name: v3-heartbeat-watch
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch: {}
permissions:
  actions: read
  contents: read
concurrency:
  group: native-heartbeat-observer
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise delayed observations without contacting notification services
        run: python3 -IB .github/test_heartbeat_watch.py
      - name: Check heartbeat and persist observed alert stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -IB .github/heartbeat_watch.py
      - name: Preserve last successfully delivered stage for the next run
        if: always() && hashFiles('heartbeat-state.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-stage-v1
          path: heartbeat-state.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90
